<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>Attendances</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #555;
            text-align: center;
            color: white;
        }

        th {
            background-color: #333;
        }

        button {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2e7d32; /* πράσινο tick */
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-back {
            background: rgba(94, 94, 94, 0.6);
            color: #b1b1b5;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-back:hover {
            background: rgba(149, 147, 147, 0.6);
        }
        .center-text {
            text-align: center;
            color: #bcbcbc !important;
        }
        .separator td {
            background-color: rgba(27, 26, 26, 0.75);
            color: #cccccc;
        }

    </style>
</head>

<section layout:fragment="main">

    <h2 class="center-text">Student Attendances</h2>
    <table>
        <thead>
        <tr>
            <th>Reservation ID</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Student Library ID</th>
            <th>Attendance</th>
        </tr>
        </thead>
        <tbody>

        <th:block th:each="booking, iter : ${bookings}">

            <!-- Separator for past reservations -->
            <tr th:if="${booking.endTime != null}
               and ${booking.endTime.isBefore(now)}
               and ${iter.index > 0}
               and ${bookings[iter.index - 1].endTime != null}
               and ${bookings[iter.index - 1].endTime.isAfter(now)}"
                class="separator">
                <td colspan="5">Past Reservations</td>
            </tr>

            <tr>
                <td th:text="${booking.reservationId}"></td>
                <td th:text="${#temporals.format(booking.startTime, 'HH:mm dd-MM-yyyy')}"></td>
                <td th:text="${#temporals.format(booking.endTime, 'HH:mm dd-MM-yyyy')}"></td>
                <td th:text="${booking.student.libraryId}"></td>
                <td>
                    <!-- Για παρελθούσες κρατήσεις -->
                    <span th:if="${booking.endTime != null and booking.endTime.isBefore(now)}"
                          th:text="${booking.present} ? 'Attended' : 'Absent'">
                    </span>

                    <!-- Για μελλοντικές / τρέχουσες κρατήσεις -->
                    <input type="checkbox"
                           th:if="${booking.endTime == null or booking.endTime.isAfter(now)}"
                           th:checked="${booking.present}"
                           th:onchange="|window.location.href='/staff/attendances/toggle/${booking.id}'|">
                </td>
            </tr>

        </th:block>

        </tbody>

    </table>

    <a th:href="@{/staff/home}">
        <button class="btn-back" type="button">← Back</button>
    </a>
</section>
</html>
