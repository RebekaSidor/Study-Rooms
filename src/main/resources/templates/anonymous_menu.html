<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>Guest Menu</title>
    <style>
        .btn-back {
            background: rgba(94, 94, 94, 0.6);
            color: #b1b1b5;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-back:hover {
            background: rgba(149, 147, 147, 0.6);
        }

        .btn-primary {
            background: rgba(209, 108, 4, 0.8) !important;
            color: #eae8e8 !important;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: rgba(243, 125, 6, 0.8) !important;
        }
        .login{
            color: #bdbdbd !important;
            text-decoration: underline;
        }

        .guest-image {
            width: 100%;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .menu-center {
            text-align: center;
        }

        .menu-center a {
            display: block;
            margin-top: 12px;
        }

        .center-text {
            text-align: center;
            color: #bcbcbc !important;
        }

    </style>
</head>

<body>
    <div layout:fragment="main">

        <h2 class="center-text">Study-Rooms / Guest User</h2>
        <img class="guest-image"
             src="https://images.unsplash.com/photo-1741699428220-65f37f3fbbcb?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDE4fHx8ZW58MHx8fHx8"
             alt="Library Image">

        <div class="menu-center">

        <a th:href="@{/showstudyspaces}">
            <button type="button" class="btn btn-primary">Show study spaces</button>
        </a>

        <a th:href="@{/login}" class="login">Login for more options</a>

        <a href="/">
            <button class="btn-back" type="button">← Back</button>
        </a>

    </div>

</body>
</html>
