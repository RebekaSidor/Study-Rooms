<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">

<head layout:fragment="header" class="text-center">
    <title>My Reservations</title>
    <style>
        .btn-back {
            background: rgba(94, 94, 94, 0.6);
            color: #b1b1b5;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-back:hover {
            background: rgba(149, 147, 147, 0.6);
        }

        .btn-cancel {
            background-color: #af2c28;  /* έντονο κόκκινο */
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-cancel:hover {
            background-color: #bf332e;
            transform: scale(1.03);
        }

        .center-text {
            text-align: center;
            color: #bcbcbc !important;
        }
    </style>
</head>

<div layout:fragment="main">

    <h2 class="center-text">Reservation History</h2>

    <div th:if="${param.cancelSuccess}">
        <p class="text-success fw-bold">
            Reservation cancelled successfully.
        </p>
    </div>

    <table class="table table-dark table-striped table-bordered text-center align-middle mt-3">
        <thead>
        <tr>
            <th>Reservation ID</th>
            <th>Study Space</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="res : ${reservations}">
            <td th:text="${res.reservationId}"></td>
            <td th:text="${res.studySpaceName}"></td>
            <td th:text="${#temporals.format(res.startTime, 'dd-MM-yyyy HH:mm')}"></td>
            <td th:text="${#temporals.format(res.endTime, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
        <span th:if="${res.endTime.isBefore(T(java.time.LocalDateTime).now())}" class="text-secondary">
            Completed
        </span>
                <span th:if="${res.startTime.isAfter(T(java.time.LocalDateTime).now())}" class="text-success">
            Upcoming
        </span>
                <span th:if="${res.startTime.isBefore(T(java.time.LocalDateTime).now()) and res.endTime.isAfter(T(java.time.LocalDateTime).now())}" class="text-primary">
            Ongoing
        </span>
            </td>
            <td th:if="${res.startTime.isAfter(T(java.time.LocalDateTime).now())}">
                <form th:action="@{'/cancel/' + ${res.id}}" method="post">
                    <button type="submit" class="btn-cancel"
                            onclick="return confirm('Are you sure you want to cancel this reservation?');">
                        Cancel
                    </button>
                </form>
            </td>
            <td th:unless="${res.startTime.isAfter(T(java.time.LocalDateTime).now())}">
                <span class="text-muted">-</span>
            </td>
        </tr>

        </tbody>
    </table>

    <div>
        <a th:href="@{/profile}">
            <button class="btn-back">← Back</button>
        </a>
    </div>

</div>
